[project]
name = "payments-service"
version = "0.1.0"
description = "Async payment processing service: FastAPI + SQLAlchemy + RabbitMQ (FastStream) with outbox, retries and DLQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14",
    "faststream[rabbit,cli]>=0.6.0,<0.8",
    "aiohttp>=3.11",
]
